<! DOCTYPE html>
    <html>


    <head>
        <title>Student Internship Form</title>
    </head>


    <body>
        <table>
            <tr>
                <td>First Name:</td>
                <td><input type="text" name="Name"></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="text" name="Email"></td>
            </tr>
            <tr>
                <td>Preferred Internship</td>
                <td><input type="radio" name="Internship" value="On-site">On-site
                <td><input type="radio" name="Internship" value="Remote">Remote</td>
            </tr>
            <tr>
                <td>Internship Duration:</td>
                <td>
                    <select name="Duration">
                        <option value="Six Weeks">Six Weeks</option>
                        <option value="Threee Months">Three months</option>
                </td>
            </tr>
            <tr>
                <td>Skill of Interest:</td>
                <td>
                    <input type="checkbox" name="Skill" value="Web Development">Web Development
                    <input type="checkbox" name="Skill" value="Data Analysis">Data Analysis
                    <input type="checkbox" name="Skill" value="Mobile apps">Mobile apps
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="submit">

                </td>
            </tr>



        </table>
    </body>

    </html>
